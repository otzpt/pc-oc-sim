<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Sim B450M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/7.css@0.21.1/dist/7.scoped.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/bios.css">
<link rel="stylesheet" href="css/os.css">
</head>
<body>
  <main class="stage" data-screen="black" data-on="0">
    <div class="scene">
      <div class="monitor">
        <div class="lcd">
          <div class="screen-fit" id="screenFit">
            <div class="screen" id="screen" tabindex="0" aria-label="Simulated monitor"></div>
          </div>
          <div class="lcd-chin">
            <span class="lcd-brand">VOID</span>
            <button class="lcd-power standby" id="btnPower" type="button" title="Power (turns the PC on and off)" aria-label="Power">
              <span class="ring"><i class="ti ti-power" aria-hidden="true"></i></span>
            </button>
          </div>
        </div>
        <div class="lcd-neck" aria-hidden="true"></div>
        <div class="lcd-base" aria-hidden="true"></div>
      </div>

      <div class="case" aria-label="Aerocool B508A Flow ARGB case">
        <div class="case-top">
          <button class="case-btn power" id="btnCasePower" type="button" title="Case power button" aria-label="Case power button"><span></span></button>
          <button class="case-btn reset" id="btnReset" type="button" title="Case reset button" aria-label="Reset"><span></span></button>
          <i class="case-hdd" id="hddLed" aria-hidden="true"></i>
          <span class="case-ports" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="case-front" aria-hidden="true"><div class="fan"></div><div class="fan"></div></div>
      </div>
    </div>
    <div class="tabletop" aria-hidden="true"></div>

    <section class="panel" aria-label="Controls">
      <div class="group">
        <h3>Keyboard</h3>
        <div class="group-row">
          <button class="hw-btn" id="btnDel" type="button" title="Press or hold during POST to enter BIOS">
            <span class="key">DEL</span><span>Hold for BIOS</span>
          </button>
        </div>
      </div>

      <div class="group">
        <h3>Motherboard debug LEDs</h3>
        <div class="leds" aria-live="polite">
          <span class="led" data-led="CPU">CPU</span>
          <span class="led" data-led="DRAM">DRAM</span>
          <span class="led" data-led="VGA">VGA</span>
          <span class="led" data-led="BOOT">BOOT</span>
        </div>
      </div>

      <div class="group readout-group">
        <h3>Telemetry</h3>
        <div class="readout" id="readout" aria-live="polite">Off. Press the power button on the monitor.</div>
      </div>

      <div class="group">
        <h3>Bench tools</h3>
        <div class="group-row">
          <button class="hw-btn" id="btnCmos" type="button" title="Short JBAT1 with the PC off">
            <i class="ti ti-battery-off" aria-hidden="true"></i><span>Clear CMOS</span>
          </button>
          <button class="hw-btn" id="btnMute" type="button">
            <i class="ti ti-volume" aria-hidden="true"></i><span>Sound on</span>
          </button>
          <button class="hw-btn" id="btnSpecs" type="button">
            <i class="ti ti-list-details" aria-hidden="true"></i><span>Parts list</span>
          </button>
        </div>
      </div>
    </section>

    <dialog class="parts" id="partsDialog">
      <h2>Parts list</h2>
      <div id="partsBody"></div>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>
    <p class="disclaimer">Simulation only. Nothing on this page reads or changes your real hardware.</p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
